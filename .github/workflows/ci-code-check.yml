name: Code Checks

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      node-version:
        required: true
        type: string
      deno-version:
        required: true
        type: string

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}
  TOOL_NODE_FLAGS: ${{ vars.TOOL_NODE_FLAGS }}

permissions:
  contents: read
  id-token: write

jobs:
  code-check:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write

    name: ${{ matrix.check == 'ts' && 'TypeScript' || 'Code Lint' }}

    strategy:
      fail-fast: false
      matrix:
        check: ['ts', 'lint']

    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c   # v1.0.0
      with:
        swap-size-gb: 4

    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Setup NodeJS
      uses: ./.github/actions/setup-node
      with:
        node-version: ${{ inputs.node-version }}
        deno-version: ${{ inputs.deno-version }}
        cache-modules: true
        install: true
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7   # v2.5.1

    - uses: ./.github/actions/restore-packages

    - name: Restore TypeScript incremental cache
      id: restore-typecheck
      if: matrix.check == 'ts'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        path: ./apps/meteor/tsconfig.typecheck.tsbuildinfo
        key: typecheck-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          typecheck-cache-${{ runner.os }}-

    - name: Cache observability (typecheck)
      if: matrix.check == 'ts'
      run: |
        {
          echo "### TypeScript incremental cache"
          echo "- **exact hit**: \`${{ steps.restore-typecheck.outputs.cache-hit }}\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Install Meteor
      shell: bash
      run: |
        # Restore bin from cache
        set +e
        METEOR_SYMLINK_TARGET=$(readlink ~/.meteor/meteor)
        METEOR_TOOL_DIRECTORY=$(dirname "$METEOR_SYMLINK_TARGET")
        set -e
        LAUNCHER=$HOME/.meteor/$METEOR_TOOL_DIRECTORY/scripts/admin/launch-meteor
        if [ -e "$LAUNCHER" ]
        then
          echo "Cached Meteor bin found, restoring it"
          sudo cp "$LAUNCHER" "/usr/local/bin/meteor"
        else
          echo "No cached Meteor bin found."
        fi

        # only install meteor if bin isn't found
        command -v meteor >/dev/null 2>&1 || curl https://install.meteor.com | sed s/--progress-bar/-sL/g | /bin/sh

    - name: TS TypeCheck
      if: matrix.check == 'ts'
      run: yarn turbo run typecheck --concurrency=5

    - name: Save TypeScript incremental cache
      if: matrix.check == 'ts' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        path: ./apps/meteor/tsconfig.typecheck.tsbuildinfo
        key: typecheck-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

    - name: Restore ESLint cache
      id: restore-eslint
      if: matrix.check == 'lint'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        path: ./apps/meteor/.eslintcache
        key: eslintcache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          eslintcache-${{ runner.os }}-

    - name: Cache observability (eslint)
      if: matrix.check == 'lint'
      run: |
        {
          echo "### ESLint cache"
          echo "- **exact hit**: \`${{ steps.restore-eslint.outputs.cache-hit }}\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Lint
      if: matrix.check == 'lint'
      run: yarn lint

    - name: Save ESLint cache
      if: matrix.check == 'lint' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        path: ./apps/meteor/.eslintcache
        key: eslintcache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
