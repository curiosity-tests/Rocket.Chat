name: Code Checks

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      node-version:
        required: true
        type: string
      deno-version:
        required: true
        type: string

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}
  TOOL_NODE_FLAGS: ${{ vars.TOOL_NODE_FLAGS }}

permissions:
  contents: read
  id-token: write

jobs:
  code-check:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write

    name: ${{ matrix.check == 'ts' && 'TypeScript' || 'Code Lint' }}

    strategy:
      fail-fast: false
      matrix:
        check: ['ts', 'lint']

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0.0
        with:
          swap-size-gb: 4

      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          deno-version: ${{ inputs.deno-version }}
          cache-modules: true
          install: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - uses: ./.github/actions/restore-packages

      - name: Restore TypeScript incremental cache
        id: restore-typecheck
        if: matrix.check == 'ts'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./apps/meteor/tsconfig.typecheck.tsbuildinfo
          key: typecheck-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            typecheck-cache-${{ runner.os }}-

      - name: Cache observability (typecheck)
        if: matrix.check == 'ts'
        run: |
          {
            echo "### TypeScript incremental cache"
            echo "- **exact hit**: \`${{ steps.restore-typecheck.outputs.cache-hit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Meteor
        shell: bash
        run: |
          # Restore bin from cache
          set +e
          METEOR_SYMLINK_TARGET=$(readlink ~/.meteor/meteor)
          METEOR_TOOL_DIRECTORY=$(dirname "$METEOR_SYMLINK_TARGET")
          set -e
          LAUNCHER=$HOME/.meteor/$METEOR_TOOL_DIRECTORY/scripts/admin/launch-meteor
          if [ -e "$LAUNCHER" ]
          then
            echo "Cached Meteor bin found, restoring it"
            sudo cp "$LAUNCHER" "/usr/local/bin/meteor"
          else
            echo "No cached Meteor bin found."
          fi

          # only install meteor if bin isn't found
          command -v meteor >/dev/null 2>&1 || curl https://install.meteor.com | sed s/--progress-bar/-sL/g | /bin/sh

      - name: TS TypeCheck
        if: matrix.check == 'ts'
        run: yarn turbo run typecheck --concurrency=5

      - name: Save TypeScript incremental cache
        if: matrix.check == 'ts' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./apps/meteor/tsconfig.typecheck.tsbuildinfo
          key: typecheck-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Restore ESLint cache
        id: restore-eslint
        if: matrix.check == 'lint'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./apps/meteor/.eslintcache
          key: eslintcache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            eslintcache-${{ runner.os }}-

      - name: Cache observability (eslint)
        if: matrix.check == 'lint'
        run: |
          {
            echo "### ESLint cache"
            echo "- **exact hit**: \`${{ steps.restore-eslint.outputs.cache-hit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        if: matrix.check == 'lint'
        run: yarn lint

      - name: Save ESLint cache
        if: matrix.check == 'lint' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./apps/meteor/.eslintcache
          key: eslintcache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
