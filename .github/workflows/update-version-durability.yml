name: Update Version Durability

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      LTS_VERSIONS:
        required: false
        type: string
    secrets:
      CI_PAT:
        required: true
      D360_TOKEN:
        required: true
      D360_USER_ID:
        required: true

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  update-versions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: |
          cd ./.github/actions/update-version-durability
          npm install

      - name: Update Version Durability
        uses: ./.github/actions/update-version-durability
        with:
          LTS_VERSIONS: ${{ inputs.LTS_VERSIONS != '' && inputs.LTS_VERSIONS || vars.LTS_VERSIONS }}
          GH_TOKEN: ${{ secrets.CI_PAT }}
          D360_TOKEN: ${{ secrets.D360_TOKEN }}
          D360_ARTICLE_ID: 800f8d52-409d-478d-b560-f82a2c0eb7fb
          D360_USER_ID: ${{ secrets.D360_USER_ID }}
          PUBLISH: true
